AutoName: Mastigias
Summary: Batch music tag editor powered by native TagLib
Description: |
    Mastigias is a simple, open-source Android music tag editor built on the
    native TagLib C++ engine via JNI. Edit a single track, a multi-track
    selection, or an entire album at once.

    Features:

    * High-performance native engine: C++ TagLib 1.13.1 via JNI, supporting MP3,
    FLAC, M4A/MP4, OGG/Opus/Vorbis, WAV, AIFF, and WMA.
    * Batch & single file editing of track metadata.
    * Embedded artwork: embed and replace album art.
    * Lyrics integration with LRCLIB search for synchronized (.lrc) and plain
    lyrics.
    * Fast full-text library search (SQLite FTS4).
    * No ads, no tracking, no accounts.

